    ## Usage
    To deploy this configuration, follow the steps below:
    
    1. Ensure you have the necessary permissions to access the repository.
    2. Clone this repository.
    
    ```shell
    git clone git@github.com:Department-for-Transport-External/dft-ozev-pipeline-stats-transform.git
    ```
    
    3. Create a feature branch with a meaningful name which will contain the required change.
    
    ```shell
    git pull
    git checkout -b feature/my-feature
    ```
    
    4. Update the Terraform configuration as needed and commit changes.
    
    ***Please note that the repository uses [commitizen](https://commitizen-tools.github.io/commitizen/) for managing the tags on the repository
    and also the CHANGELOG.md. In order for this to work correctly, commit messages should following the structure detailed on the
    [conventionalcommits](https://www.conventionalcommits.org/en/v1.0.0/) page. When following the conventionalcommits standard features would be
    commited with messages following the structure below:***
    
    ```shell
    git add .
    git commit -am "feat: Details about my new feature"
    ```
    
    ***Please consult [conventionalcommits](https://www.conventionalcommits.org/en/v1.0.0/) page for more information on this.***
    
    5. Push your changes to Azure DevOps.
    
    ```shell
    git push --set-upstream origin feature/my-feature
    ```
    
    6. Create a pull request to merge the changes into the `main` branch.
    7. The Azure Pipeline will trigger a `terraform plan` in [Terraform Cloud](https://app.terraform.io/app/KCAD/workspaces/gcp-plat-ident/runs).
    8. Before completing the pull request the following criteria should be met:
    - Associated Build Validation Policies have run and completed successfully
    - At least two reviewers have approved the change
    - The Terraform plan has completed successfully without any errors
    
    9. Once the pull request has been completed and changes merged, confirm and run the `terraform apply` in [Terraform Cloud](https://app.terraform.io/app/KCAD/workspaces/gcp-plat-ident/runs) to apply the changes.
    
    For detailed information on each module and its variables, refer to the module documentation linked in the configuration files.
    
