    # DfT OZEV Open Data Stats Pipeline
    
    ## Summary
    This repository contains Terraform configuration for managing Google Cloud Platform (GCP) resources, which utilised by the DfT OZEV Open Stats pipeline. It includes configurations for setting up Cloud Run Job, Cloud Scheduler and BigQuery Tables used by and for execute the Stats pipeline.
  
    
    {{ .Content }}
    
