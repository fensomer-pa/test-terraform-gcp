# .github/workflows/deploy.yml
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string

jobs:
  trigger-deployment:
    environment: ${{ github.event.inputs.environment }}  # e.g., 'staging', 'production'
    runs-on: ubuntu-latest
    
    # Acquire secrets from the environment
    steps:
    # (You need to set secrets for each environment via GitHub UI: Repository Settings > Environments > <env> > Secrets)

    outputs:
      app_secret: ${{ secrets.APP_SECRET }}
      api_key: ${{ secrets.API_KEY }}

    # Call the shared workflow, passing secrets as inputs
    uses: ./.github/workflows/shared-deploy.yml
    with:
      app_secret: ${{ secrets.APP_SECRET }}
      api_key: ${{ secrets.API_KEY }}
