# .github/workflows/deploy.yml
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string

jobs:
  trigger-deployment:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - uses: shared-deploy.yml
        with:
          app_secret: ${{ secrets.APP_SECRET }}
          api_key: ${{ secrets.API_KEY }}
