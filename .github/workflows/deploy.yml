# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - "feature/**"

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - id: 'deploy'
        uses: ./.github/workflows/tf_plan.yml
        secrets: inherit
