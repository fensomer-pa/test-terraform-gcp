# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - "feature/**"

jobs:
  plan-dev:
    # Calls the reusable workflow from a different repository
    uses: ./.github/workflows/tf_plan.yml
    with:
      environment: dev
    # This is key: it passes all secrets from the 'dev' environment
    # to the reusable workflow.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
