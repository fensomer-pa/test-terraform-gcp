# .github/workflows/crj-deploy.yml
name: Deploying Cloud Run Job

on:
  workflow_dispatch:
    inputs:
      pipeline_name:
        required: true
        type: string
        description: The pipeline being deployed
      environment_name:
        required: true
        type: string
        description: The environment name being deployed to
      image_tag:
        required: true
        type: string
        description: The image tag to deployed

permissions:
  contents: 'read'
  id-token: 'write'

run-name: ${{ github.actor }} has trigger deployment for ${{ inputs.pipeline-name }}  🚀

jobs:
  deploy-ftr:
    if: ${{ inputs.environment-name == 'ftr' }}
    environment: dev
    name: Deploy ${{ inputs.pipeline-name }} to ${{ inputs.environment-name }}
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "Running With Params"
          echo ${{ inputs.pipeline-name }}
          echo ${{ inputs.environment-name }}
          echo ${{ inputs.image-tag }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run Terraform
        uses: ./.github/actions/tf-cli
        with:
          environment_name: dev
          working_directory: 'pipelines/${{ inputs.pipeline-name }}'

  deploy-dev:
    if: ${{ inputs.environment-name == 'dev' }}
    environment: dev
    name: Deploy ${{ inputs.pipeline-name }} to ${{ inputs.environment-name }}
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "Running With Params"
          echo ${{ inputs.pipeline-name }}
          echo ${{ inputs.environment-name }}
          echo ${{ inputs.image-tag }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run Terraform
        uses: ./.github/actions/tf-cli
        with:
          environment_name: ${{ inputs.environment-name }}
          working_directory: 'pipelines/${{ inputs.pipeline-name }}'
