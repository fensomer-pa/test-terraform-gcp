name: platform-changes.yml
on:
  pull_request:
    paths:
      - 'platform/**'
  push:
    branches:
      - 'main'
      - 'feature/**'

jobs:
  tf_apply_dev:
    uses: ./.github/workflows/tf-deploy.yml
    with:
      environment: ${{ vars.ENVIRONMENT_NAME }}
      working-directory: 'platform'
    secrets: inherit
